services:
    - type: web
      name: longmemory
      runtime: docker
      dockerfilePath: ./Dockerfile
      dockerContext: .
      plan: starter
      healthCheckPath: /health
      autoDeployTrigger: commit
      envVars:
          - key: LONGMEMORY_API_KEY
            generateValue: true
          - key: LONGMEMORY_MCP_HTTP
            value: true
          - key: LONGMEMORY_DB_PATH
            value: /data/longmemory.db
      disk:
          name: longmemory-data
          mountPath: /data
          sizeGB: 1
