#  file  : integrations/mcp-configs/librechat.yaml
#  usage : configures the LongMemory mcp-configs integration

mcpSettings:
  allowedAddresses:
    - "host.docker.internal:7331"

mcpServers:
  longmemory:
    title: LongMemory
    description: Durable project memory, recall, decisions, and task state.
    type: streamable-http
    url: "http://host.docker.internal:7331/mcp"
    headers:
      Authorization: "Bearer ${LONGMEMORY_API_KEY}"
    requiresOAuth: false
    serverInstructions: true
